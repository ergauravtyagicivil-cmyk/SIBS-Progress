<!doctype html>
<html lang="en" class="spxg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="referrer" content="no-referrer">
<title>SIBS Progress</title>
<style id="spxStyle">
:root{--bg:#f3f5f7;--card:#fff;--ink:#14202b;--sub:#5b6875;--line:#d5dbe1;--acc:#0b6e6e;--err:#b42318}
@media (prefers-color-scheme:dark){:root{--bg:#0f1519;--card:#182128;--ink:#e8eef2;--sub:#9aa7b2;--line:#2c3740;--acc:#3fb8b0;--err:#f97066}}
*{box-sizing:border-box}
html.spxg,html.spxg body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#spxWrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
.card{width:100%;max-width:380px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:28px 24px}
.mark{width:40px;height:40px;border-radius:10px;background:var(--acc);display:grid;place-items:center;margin-bottom:14px}
h1{font-size:20px;margin:0 0 4px}
p{margin:0 0 18px;color:var(--sub);font-size:14px}
label{display:block;font-size:13px;font-weight:600;margin-bottom:6px}
input[type=password]{width:100%;padding:11px 12px;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:9px}
input[type=password]:focus{outline:2px solid var(--acc);outline-offset:1px}
.row{display:flex;align-items:center;gap:8px;margin:12px 0 18px;font-size:14px;color:var(--sub)}
button{width:100%;padding:11px;font:inherit;font-weight:600;color:#fff;background:var(--acc);border:0;border-radius:9px;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
.msg{min-height:20px;margin-top:12px;font-size:14px;color:var(--err)}
.foot{margin-top:18px;font-size:12px;color:var(--sub)}
.hide{display:none}
</style>
</head>

  <h1>SIBS Trunk Sewer Progress</h1>
  <p>This page is protected. Enter the password to view it.</p>
  <form id="spxForm" autocomplete="off">
    <label for="spxPw">Password</label>
    <input type="password" id="spxPw" required autofocus>
    <div class="row"><input type="checkbox" id="spxKeep"><label for="spxKeep" style="margin:0;font-weight:400">Keep me signed in on this device</label></div>
    <button id="spxGo">Open</button>
    <div class="msg" id="spxMsg" role="alert"></div>
    <div class="hide" id="spxLocal" style="margin-top:12px;font-size:14px;color:var(--sub)">
      Opening the file on this computer? Select the <b>key.json</b> file from the same folder, then press Open.
      <input type="file" id="spxKeyFile" accept=".json,application/json" style="margin-top:8px;width:100%">
    </div>
  </form>
  <div class="foot">Confidential &middot; authorised project staff only</div>
</main></div>

<script>
(function(){

  function unb64(s){var b=atob(s),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u}
  function b64(u){var s='';for(var i=0;i<u.length;i+=0x8000)s+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000));return btoa(s)}

  async function openWith(raw){

    var pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:c.subarray(0,12)},k,c.subarray(12));
    var html=new TextDecoder().decode(pt);
    if(document.readyState!=='complete')await new Promise(function(r){window.addEventListener('load',r,{once:true})});
    ['spxStyle','spxWrap','spxData'].forEach(function(i){var e=$(i);if(e)e.remove()});
    document.documentElement.className='';
    document.open();document.write(html);document.close();
  }
  var picked=null;
  async function keyFile(){
    if(picked)return picked;
    for(var i=0;i<KEYURLS.length;i++){
      try{var r=await fetch(KEYURLS[i]+'?t='+Date.now(),{cache:'no-store'});if(r.ok)return await r.json()}catch(e){}
    }
    throw new Error('net');
  }
  async function unlock(pw){
    var kf=await keyFile();
    var base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
    var wk=await crypto.subtle.deriveKey({name:'PBKDF2',salt:unb64(kf.salt),iterations:kf.iter,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
    var c=unb64(kf.c);
    var raw=new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM',iv:c.subarray(0,12)},wk,c.subarray(12)));
    return b64(raw);
  }
  if(!window.crypto||!crypto.subtle){show('This browser cannot open protected pages. Use an up-to-date Chrome, Edge, Safari or Firefox.');$('spxGo').disabled=true;return}
  $('spxForm').onsubmit=async function(e){
    e.preventDefault();var b=$('spxGo');b.disabled=true;$('spxMsg').textContent='';b.textContent='Checking…';
    try{
      var raw=await unlock($('spxPw').value);
      put('sessionStorage',raw);if($('spxKeep').checked)put('localStorage',raw);
      await openWith(raw);
    }catch(err){
      b.disabled=false;b.textContent='Open';
      if(err&&err.message==='net'){
        $('spxLocal').classList.remove('hide');
        $('spxMsg').textContent=location.protocol==='file:'?'':'Could not reach the server. Check your connection, or select key.json below.';
      }else{$('spxMsg').textContent='That password is not correct.';$('spxPw').select()}
    }
  };
  $('spxKeyFile').onchange=function(e){
    var f=e.target.files[0];if(!f)return;var r=new FileReader();
    r.onload=function(){try{var o=JSON.parse(r.result);if(o.spx!=='key')throw 0;picked=o;$('spxMsg').textContent='';$('spxPw').focus()}
      catch(x){picked=null;$('spxMsg').textContent='That is not the key.json file for this page.'}};
    r.readAsText(f);
  };
  if(location.protocol==='file:')$('spxLocal').classList.remove('hide');
  var saved=get('sessionStorage')||get('localStorage');
  if(saved){openWith(saved).then(function(){put('sessionStorage',saved)},function(){clear();show()})}else show();
})();
</script>
